name: core-spike
on:
  push:
    paths: [".github/workflows/spike.yml"]
  workflow_dispatch:
jobs:
  wasmsim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust + wasm
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: "Rodar simulacao (nativo) - placar real"
        run: |
          set -o pipefail
          cargo test -p wasmsim -- --nocapture 2>&1 | tail -40
        continue-on-error: true
      - name: "Compilar wasmsim -> wasm"
        run: |
          set -o pipefail
          RUSTFLAGS='--cfg getrandom_backend="wasm_js"' cargo build -p wasmsim --target wasm32-unknown-unknown 2>&1 | tail -20
        continue-on-error: true
