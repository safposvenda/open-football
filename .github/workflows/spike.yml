name: core-spike
on:
  push:
    paths: [".github/workflows/spike.yml"]
  workflow_dispatch:
jobs:
  wasmsim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust + wasm
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: "Rodar simulacao em RELEASE - placar real"
        run: |
          set -o pipefail
          cargo test -p wasmsim --release -- --nocapture 2>&1 | tail -30
        continue-on-error: true
      - name: "Compilar wasmsim -> wasm (release)"
        run: |
          set -o pipefail
          RUSTFLAGS='--cfg getrandom_backend="wasm_js"' cargo build -p wasmsim --release --target wasm32-unknown-unknown 2>&1 | tail -15
          ls -la target/wasm32-unknown-unknown/release/*.wasm 2>&1 | tail -3
        continue-on-error: true
