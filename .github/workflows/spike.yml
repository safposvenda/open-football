name: core-spike
on:
  push:
    paths: [".github/workflows/spike.yml"]
  workflow_dispatch:
jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: "experimento forca x placar (cargo test --release)"
        run: |
          set -o pipefail
          cargo test -p wasmsim --release -- --nocapture 2>&1 | tail -60
